
<!DOCTYPE html>
<html>
<head>
<title>MDM4U</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-teal.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>
body {
  font-family: "Roboto", sans-serif;
}

.w3-bar-block .w3-bar-item {
  padding: 16px;
  font-weight: bold;
}

.graph-container {
  margin-bottom: 40px;
}

.graph-container iframe {
  display: block;
  width: 100%;
  max-width: 700px;
  height: 500px;
  border: 1px solid #ccc;
}
</style>

<script src="https://code.jquery.com/jquery-1.10.2.js"></script>
</head>

<body>

<!-- Navigation bar -->
<div id="nav-placeholder">
</div>

<script>
$(function(){
  $("#nav-placeholder").load("nav.html");
});
</script>
<!-- End of Navigation bar -->

<div class="w3-overlay w3-hide-large w3-animate-opacity"
     onclick="w3_close()"
     style="cursor:pointer"
     id="myOverlay">
</div>

<div class="w3-main" style="margin-left:250px;">

<div id="myTop" class="w3-container w3-top w3-theme w3-large">
  <p>
    <i class="fa fa-bars w3-button w3-teal w3-hide-large w3-xlarge"
       onclick="w3_open()"></i>
    <span id="myIntro" class="w3-hide">MDM4U</span>
  </p>
</div>

<!-- Page title -->
<header class="w3-container w3-theme" style="padding:64px 32px">
  <h1 class="w3-xxxlarge">Module 1.4 : Sources de données</h1>
</header>

<div class="w3-container" style="padding:32px">

  <h1>Les types de distributions</h1>

  <!-- Distribution en U -->
  <div class="graph-container">
    <h2>La distribution en U</h2>

    <iframe
      src="https://www.desmos.com/calculator/dk5elfxzbk?embed"
      title="Graphique de la distribution en U"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Distribution asymétrique -->
  <div class="graph-container">
    <h2>La distribution asymétrique</h2>

    <iframe
      src="https://www.desmos.com/calculator/e3jxn1q9nq?embed"
      title="Graphique de la distribution asymétrique"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Distribution uniforme -->
  <div class="graph-container">
    <h2>La distribution uniforme</h2>

    <iframe
      src="https://www.desmos.com/calculator/ntxtqgw7ev?embed"
      title="Graphique de la distribution uniforme"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Distribution en cloche -->
  <div class="graph-container">
    <h2>La distribution en cloche</h2>

    <iframe
      src="https://www.desmos.com/calculator/qo4rxqrjiw?embed"
      title="Graphique de la distribution en cloche"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

</div>

<!-- Footer -->
<footer class="w3-container w3-theme" style="padding:32px">
  <p>Contenu de cette page web par M. Gore (prénom: Pytha)</p>
</footer>

</div>

<script>

// Open and close the sidebar on medium and small screens
function w3_open() {
  document.getElementById("mySidebar").style.display = "block";
  document.getElementById("myOverlay").style.display = "block";
}

function w3_close() {
  document.getElementById("mySidebar").style.display = "none";
  document.getElementById("myOverlay").style.display = "none";
}

// Change style of top container on scroll
window.onscroll = function() {
  myFunction();
};

function myFunction() {
  if (document.body.scrollTop > 80 ||
      document.documentElement.scrollTop > 80) {

    document.getElementById("myTop").classList.add(
      "w3-card-4",
      "w3-animate-opacity"
    );

    document.getElementById("myIntro").classList.add(
      "w3-show-inline-block"
    );

  } else {

    document.getElementById("myIntro").classList.remove(
      "w3-show-inline-block"
    );

    document.getElementById("myTop").classList.remove(
      "w3-card-4",
      "w3-animate-opacity"
    );
  }
}

</script>

</body>
</html>
